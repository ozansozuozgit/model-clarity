    <text class="ink" x="84" y="69" font-size="18" font-weight="850">AI Cheatsheet</text>
    <text class="faint brandSmall" x="84" y="88" font-size="10" font-weight="780" letter-spacing="0.7">QUICK REFERENCE</text>

    <g transform="translate(884 56)">
      <rect class="soft" x="0" y="0" width="66" height="30" rx="15"/>
      <text class="muted" x="33" y="20" text-anchor="middle" font-size="12" font-weight="760">Models</text>
