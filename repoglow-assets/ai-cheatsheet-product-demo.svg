    <text class="muted" x="84" y="203" font-size="15" font-weight="500">Start with API-ready model names. Use lookup when a vendor page mentions an app, agent,</text>
    <text class="muted" x="84" y="224" font-size="15" font-weight="500">subscription, or tool you do not recognize.</text>

