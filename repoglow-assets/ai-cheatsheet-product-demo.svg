<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Cheatsheet product demo</title>
  <desc id="desc">A light theme AI Cheatsheet app screen showing current model names, product lookup, and stack shortlist sections.</desc>
  <style>
    .bg { fill: #f8f7f1; }
    .app { fill: #fbfaf6; stroke: #dedbd2; stroke-width: 1.2; }
    .panel { fill: #ffffff; stroke: #e1ded5; stroke-width: 1.1; }
    .soft { fill: #f1f0ea; }
    .softStroke { fill: #f1f0ea; stroke: #e1ded5; stroke-width: 1; }
    .accentSoft { fill: #e7f4f5; }
    .positiveSoft { fill: #edf8f1; }
    .previewSoft { fill: #f2edf7; }
    .cautionSoft { fill: #fbf2df; }
    .ink { fill: #202a35; }
    .muted { fill: #5d6672; }
    .faint { fill: #838c98; }
    .accent { fill: #2e7f93; }
    .accentStroke { fill: none; stroke: #2e7f93; stroke-width: 1.4; }
    .positive { fill: #1f714e; }
    .preview { fill: #8665a7; }
    .caution { fill: #87632c; }
    .line { stroke: #e1ded5; stroke-width: 1; }
    .lineSoft { stroke: #ece9df; stroke-width: 1; }
    .brandSmall, .kicker, .mono, .tableHead, .count { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    text { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; letter-spacing: 0; }
  </style>

  <rect class="bg" width="1280" height="720"/>
  <rect class="app" x="34" y="26" width="1212" height="668" rx="24"/>

  <g>
